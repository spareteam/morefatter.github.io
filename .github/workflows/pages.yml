name: Publish website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check website
        run: npm run check
      - name: Install browser test tools
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Use the runner's Chrome for original H.264 media
        run: |
          chrome_path="$(command -v google-chrome)"
          test -x "$chrome_path"
          printf 'PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=%s\n' "$chrome_path" >> "$GITHUB_ENV"
      - name: Prepare website files
        run: npm run build
      - name: Test native mobile autoplay in Safari's WebKit engine
        id: webkit-tests
        env:
          TEST_BUILT_SITE: '1'
          TEST_BROWSER: webkit
        run: |
          set -o pipefail
          # Keep WebKit on unmodified native playback; the full Chrome suite also
          # tests rejection and frozen-frame simulations that override media APIs.
          node --test --test-name-pattern='Native mobile playback' tests/browser.test.cjs 2>&1 | tee /tmp/morefatter-webkit-tests.log
      - name: Test website interactions and layouts
        id: browser-tests
        env:
          TEST_BUILT_SITE: '1'
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/morefatter-browser-tests.log
      - name: Explain a browser test failure
        if: failure() && (steps.browser-tests.outcome == 'failure' || steps.webkit-tests.outcome == 'failure')
        env:
          CHROME_FAILED: ${{ steps.browser-tests.outcome == 'failure' }}
          WEBKIT_FAILED: ${{ steps.webkit-tests.outcome == 'failure' }}
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          for (const [engine, failed, path] of [
            ['Chrome', process.env.CHROME_FAILED, '/tmp/morefatter-browser-tests.log'],
            ['WebKit', process.env.WEBKIT_FAILED, '/tmp/morefatter-webkit-tests.log'],
          ]) {
            if (failed !== 'true' || !existsSync(path)) continue;
            const log = readFileSync(path, 'utf8').slice(-12000);
            for (let i = 0; i < log.length; i += 3000) {
              const message = log.slice(i, i + 3000).replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
              console.log(`::error title=${engine} test details ${1 + i / 3000}::${message}`);
            }
          }
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Show website link
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf '## Website published\n\n[Open More Fatter](%s)\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
