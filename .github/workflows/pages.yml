name: Publish website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check website
        run: npm run check
      - name: Install browser test tools
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test website interactions and layouts
        id: browser-tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/morefatter-browser-tests.log
      - name: Explain a browser test failure
        if: failure() && steps.browser-tests.outcome == 'failure'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const log = readFileSync('/tmp/morefatter-browser-tests.log', 'utf8').slice(-30000);
          const message = log.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          console.log(`::error title=Browser test details::${message}`);
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html style.css app.js shop.js content.json .nojekyll _site/
          if [ -d assets ]; then cp -R assets _site/; fi
      - name: Upload website
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Show website link
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf '## Website published\n\n[Open More Fatter](%s)\n' "$SITE_URL" >> "$GITHUB_STEP_SUMMARY"
